name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish
    uses: projek-xyz/actions/.github/workflows/release.yml@a84ced1eab6fac0576ed5cdd43f6ee0dfa5044a3 # main @ 2026-11-02

    permissions:
      contents: write

  update-assets:
    name: Upload assets
    needs: publish
    uses: projek-xyz/actions/.github/workflows/uploads.yml@a84ced1eab6fac0576ed5cdd43f6ee0dfa5044a3 # main @ 2026-11-02
    with:
      workflow-name: CI

    permissions:
      contents: write

  old-publish:
    name: Publish binaries
    if: false
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build
      run: |
        mkdir releases
        echo 'first' > releases/first.txt
        echo 'second' > releases/second.txt
        npx @feryardiant/read-changelog > PUBLISH.txt

    - name: Upload binaries to release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: releases/*.txt
        body_path: PUBLISH.txt
